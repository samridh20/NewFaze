<!doctype html><html lang="en"><head><meta charset="utf-8"><title>FaZe Odyssey</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{font:16px system-ui;margin:2rem auto;max-width:44rem;background:#111;color:#eee}button{padding:.5rem 1rem;margin:.25rem}
.card{border:1px solid #444;padding:1rem;margin:1rem 0;border-radius:8px}a{color:#ff5a36}</style></head><body>
<h1>FaZe Odyssey</h1><nav><a href="/">Lobby</a></nav><main id="app" aria-live="polite"></main>
<script>
const API="http://localhost:8001",AUTH="http://localhost:8003";let token=null;
const $=(h)=>{document.getElementById("app").innerHTML=h};
const api=async(p,o={})=>{const r=await fetch(API+p,{...o,headers:{"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{}),"Idempotency-Key":crypto.randomUUID(),...(o.headers||{})}});return{status:r.status,body:await r.json().catch(()=>({}))}};
async function signIn(account){const r=await fetch(AUTH+"/dev/token",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({account})});token=(await r.json()).access_token;sessionStorage.setItem("t",token)}
async function lobby(){const{body}=await api("/v1/lobby");const w=body.this_week,l=body.last_final_cut;
 $(`<h2>This week</h2>${w?`<div class="card" data-testid="this-week"><h3>${w.title}</h3><p>State: ${w.state}</p><a href="/drop/${w.slug}">Open the Drop</a></div>`:"<p>No drop yet.</p>"}
 ${l?`<div class="card" data-testid="last-final-cut"><h3>Latest Final Cut</h3><a href="/final-cut/${l.slug}">${l.title}</a></div>`:""}`)}
async function drop(slug){const{body}=await api("/v1/campaigns/"+slug);const f=body.finalists||[];
 $(`<h2>${body.title}</h2><p data-testid="state">State: ${body.ballot?body.ballot.state:"?"}</p>
 ${token?"":'<p><button id="signin">Sign in as demo fan (ava)</button></p>'}
 <div id="finalists">${f.map(x=>`<div class="card"><h3>Clip ${x.label}</h3><p>${x.handle||""}</p><p><small>${x.playback_url||""}</small></p><button data-vote="${x.entry_id}">Vote for ${x.label}</button></div>`).join("")}</div>
 <p id="result" role="status"></p>`);
 const si=document.getElementById("signin");if(si)si.onclick=async()=>{await signIn("fan-ava");drop(slug)};
 document.querySelectorAll("[data-vote]").forEach(b=>b.onclick=async()=>{if(!token){document.getElementById("result").textContent="Sign in first";return}
  const r=await api(`/v1/ballots/${body.ballot.id}/votes`,{method:"POST",body:JSON.stringify({entry_id:b.dataset.vote})});
  document.getElementById("result").textContent=r.status<300?"Vote recorded":("Vote refused: "+(r.body.title||r.status))})}
async function finalCut(slug){const{status,body}=await api("/v1/episodes/"+slug);if(status!==200){$("<p>Not published yet.</p>");return}
 const real=body.real.tally||{},labels=body.real.labels||{};
 $(`<h2 data-testid="episode-title">${body.title}: Final Cut</h2>
 <div class="card" data-testid="sequence">${body.sequence.map(p=>`<p>${p.kind}: <small>${p.playback_url||"-"}</small></p>`).join("")}</div>
 <div class="card" data-testid="real-tally"><h3>Real result</h3>${Object.entries(real).map(([k,v])=>`<p>Clip ${labels[k]||k}: ${v} votes</p>`).join("")}</div>
 ${body.sim_vs_fans?`<div class="card" data-testid="sim-vs-fans"><h3>Sim vs Fans (simulated, uncalibrated)</h3>${Object.entries(body.sim_vs_fans.predicted).map(([k,v])=>`<p>Clip ${labels[k]||k}: simulated ${(v*100).toFixed(0)}% / real ${body.sim_vs_fans.real[k]} votes</p>`).join("")}</div>`:""}
 <h3>Credits</h3><ul>${body.credits.map(c=>`<li>${c.role}: ${c.handle}</li>`).join("")}</ul>`)}
token=sessionStorage.getItem("t");
const p=location.pathname.split("/").filter(Boolean);
if(p[0]==="drop")drop(p[1]);else if(p[0]==="final-cut")finalCut(p[1]);else lobby();
</script></body></html>
