[project]
name = "scrim-runner"
version = "0.1.0"
description = "Personas, behavioral policy, sequential OASIS driver, record and replay, paired metrics"
requires-python = ">=3.11,<3.12"
dependencies = [
  "faze-common",
  "camel-oasis==0.2.6",
  "numpy>=1.26",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scrim"]
