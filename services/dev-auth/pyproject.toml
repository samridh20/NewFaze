[project]
name = "dev-auth"
version = "0.1.0"
description = "Local JWT issuer that stands in for Supabase Auth in DEMO_MODE"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pyjwt[crypto]>=2.9",
  "cryptography>=43",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dev_auth"]
