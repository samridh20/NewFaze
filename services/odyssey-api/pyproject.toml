[project]
name = "odyssey-api"
version = "0.1.0"
description = "Odyssey API: sole owner of campaign state (public and internal listeners)"
requires-python = ">=3.11,<3.12"
dependencies = [
  "faze-common",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["odyssey_api"]
