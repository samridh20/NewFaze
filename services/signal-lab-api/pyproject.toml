[project]
name = "signal-lab-api"
version = "0.1.0"
description = "Signal Lab API: Studio, Scrims, VOD Review, Partners, Lore, MiroFish panel"
requires-python = ">=3.11,<3.12"
dependencies = [
  "faze-common",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "arq>=0.26",
  "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["signal_lab_api"]
