[project]
name = "workers"
version = "0.1.0"
description = "arq workers: outbox relay, outcomes, calibration, backtests, scrims, key janitor"
requires-python = ">=3.11,<3.12"
dependencies = [
  "faze-common",
  "scrim-runner",
  "arq>=0.26",
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["workers"]
