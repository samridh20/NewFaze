[project]
name = "fixture-gateway"
version = "0.1.0"
description = "Deterministic local stand-in for the LLM router, used when no provider key is configured"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fixture_gateway"]
