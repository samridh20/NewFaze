[project]
name = "faze-common"
version = "0.1.0"
description = "Shared auth, errors, state tables, idempotency, rate limits, quoting and redaction"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic[email]>=2.7",
  "pydantic-settings>=2.4",
  "pyjwt[crypto]>=2.9",
  "httpx>=0.27",
  "structlog>=24.4",
  "redis>=5.0",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["faze_common"]
